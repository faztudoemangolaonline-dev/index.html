name: faz_tudo_tecnologia_iptv
description: Faz Tudo Tecnologia IPTV para Android e Windows.
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  xml: ^6.5.0
  shared_preferences: ^2.3.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/cinematic_intro.wav
    - assets/images/ananias.jpg
