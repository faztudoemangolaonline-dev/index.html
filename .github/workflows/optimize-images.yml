name: Optimise imagens WebP

on:
  push:
    branches: [main]
    paths:
      - 'image-assets-[0-9][0-9].json'
      - 'scripts/optimize-image-assets.mjs'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar conversor
        run: |
          mkdir -p /tmp/ftt-optimizer
          cd /tmp/ftt-optimizer
          npm init -y
          npm install sharp
      - name: Converter imagens sem apagar originais
        run: NODE_PATH=/tmp/ftt-optimizer/node_modules node scripts/optimize-image-assets.mjs
      - name: Guardar versões WebP no GitHub
        run: |
          if git diff --quiet -- image-assets-webp-*.json; then
            echo "Sem alterações nas imagens optimizadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-assets-webp-*.json
          git commit -m "Generate optimised WebP image assets"
          git push
