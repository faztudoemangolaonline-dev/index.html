name: Build Faz Tudo IPTV Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android-reader/**"
      - ".github/workflows/android-reader.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-reader
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: faz-tudo-iptv-debug-apk
          path: android-reader/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
