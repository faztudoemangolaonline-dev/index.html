name: Build Faz Tudo IPTV
on:
  workflow_dispatch:
  push:
    paths:
      - 'FazTudoTecnologia_IPTV/**'
      - '.github/workflows/build-faztudo-iptv.yml'
permissions:
  contents: write
concurrency:
  group: faztudo-iptv-build
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: FazTudoTecnologia_IPTV
        run: flutter create . --platforms=android
      - name: Generate lightweight Faz Tudo Android app icon
        working-directory: FazTudoTecnologia_IPTV
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/generate_brand_assets.py android
      - name: Enable Android TV launcher and remote-control support
        working-directory: FazTudoTecnologia_IPTV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          features = '''    <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
          '''
          if "android.software.leanback" not in source:
              source = source.replace("<application", features + "    <application", 1)
          if 'android:banner="@drawable/tv_banner"' not in source:
              source = source.replace("<application", '<application android:banner="@drawable/tv_banner"', 1)
          # Android TV needs a separate MAIN + LEANBACK_LAUNCHER filter.
          source = source.replace('                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' + chr(10), '')
          activity_start = source.find("<activity")
          activity_end = source.find("</activity>", activity_start)
          if activity_start < 0 or activity_end < 0:
              raise SystemExit("Flutter MainActivity was not found in AndroidManifest.xml")
          if "android.intent.category.LEANBACK_LAUNCHER" not in source:
              tv_filter = '''            <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
              '''
              source = source[:activity_end] + tv_filter + source[activity_end:]
          manifest.write_text(source)
          PY
      - name: Ensure Android internet permission
        working-directory: FazTudoTecnologia_IPTV
        run: sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Enable Android startup after device boot
        working-directory: FazTudoTecnologia_IPTV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in source:
              source = source.replace("<application", permission + chr(10) + "    <application", 1)
          receiver = """        <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
          """
          if ".BootReceiver" not in source:
              source = source.replace("</application>", receiver + "    </application>")
          manifest.write_text(source)
          main = next(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          package = next(line.split()[1] for line in main.read_text().splitlines() if line.startswith("package "))
          boot = main.parent / "BootReceiver.kt"
          boot.write_text(f'''package {package}

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {{
              override fun onReceive(context: Context, intent: Intent) {{
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {{
                      val launch = Intent(context, MainActivity::class.java)
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(launch)
                  }}
              }}
          }}
          ''')
          PY
      - name: Generate original cinematic intro sound
        working-directory: FazTudoTecnologia_IPTV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math, struct, wave
          rate, duration = 22050, 5.2
          path = Path("assets/audio/cinematic_intro.wav")
          path.parent.mkdir(parents=True, exist_ok=True)
          frames = int(rate * duration)
          with wave.open(str(path), "wb") as audio:
              audio.setnchannels(2)
              audio.setsampwidth(2)
              audio.setframerate(rate)
              samples = bytearray()
              for i in range(frames):
                  t = i / rate
                  fade = min(1.0, t / 0.25) * min(1.0, max(0.0, (duration - t) / 0.8))
                  freq = 48 + 95 * t / duration
                  bass = math.sin(2 * math.pi * freq * t) * 0.19
                  low = math.sin(2 * math.pi * 72 * t) * 0.10
                  air = math.sin(2 * math.pi * (330 + 520 * t / duration) * t) * 0.035
                  chime_env = math.exp(-max(0.0, t - 3.65) * 2.7) if t >= 3.65 else 0.0
                  chime = (math.sin(2 * math.pi * 660 * t) + 0.55 * math.sin(2 * math.pi * 990 * t)) * 0.045 * chime_env
                  value = max(-1.0, min(1.0, (bass + low + air + chime) * fade))
                  samples.extend(struct.pack("<hh", int(value * 0.96 * 32767), int(value * 0.90 * 32767)))
              audio.writeframes(samples)
          print(f"Generated {path}: {path.stat().st_size} bytes")
          PY
      - name: Resolve packages
        working-directory: FazTudoTecnologia_IPTV
        run: flutter pub get
      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ.get('PUB_CACHE', Path.home() / '.pub-cache')) / 'hosted/pub.dev'
          for gradle in root.glob('*/android/build.gradle*'):
              source = gradle.read_text()
              updated = re.sub(r'(?m)(\\bcompileSdk(?:Version)?\\s*(?:=\\s*)?)\\d+', r'\\g<1>36', source)
              if updated != source:
                  gradle.write_text(updated)
          app = Path('FazTudoTecnologia_IPTV/android/app')
          for gradle in app.glob('build.gradle*'):
              source = gradle.read_text()
              updated = re.sub(r'(?m)(\\bcompileSdk\\s*(?:=\\s*)?)flutter\\.compileSdkVersion', r'\\g<1>36', source)
              if updated != source:
                  gradle.write_text(updated)
          PY
      - name: Run IPTV parser tests
        working-directory: FazTudoTecnologia_IPTV
        run: flutter test test/iptv_core_test.dart
      - name: Build APK
        working-directory: FazTudoTecnologia_IPTV
        run: |
          flutter build apk --release --build-name=1.1.0 --build-number=${GITHUB_RUN_NUMBER}
          flutter build apk --release --split-per-abi --build-name=1.1.0 --build-number=${GITHUB_RUN_NUMBER}
      - uses: actions/upload-artifact@v4
        with:
          name: FazTudo-IPTV-Android-APKs
          path: FazTudoTecnologia_IPTV/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows project
        working-directory: FazTudoTecnologia_IPTV
        run: flutter create . --platforms=windows
      - name: Generate Faz Tudo Windows app icon
        working-directory: FazTudoTecnologia_IPTV
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tool/generate_brand_assets.py windows
      - name: Resolve packages
        working-directory: FazTudoTecnologia_IPTV
        run: flutter pub get
      - name: Run IPTV parser tests
        working-directory: FazTudoTecnologia_IPTV
        run: flutter test test/iptv_core_test.dart
      - name: Build Windows app
        working-directory: FazTudoTecnologia_IPTV
        run: flutter build windows --release --build-name=1.1.0 --build-number=${{ github.run_number }}
      - name: Package Windows files
        shell: pwsh
        run: Compress-Archive -Path "FazTudoTecnologia_IPTV/build/windows/x64/runner/Release/*" -DestinationPath "FazTudoTecnologia_IPTV-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FazTudo-IPTV-Windows
          path: FazTudoTecnologia_IPTV-Windows.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish permanent downloads
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: FazTudo-IPTV-Android-APKs
          path: release-files
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: FazTudo-IPTV-Windows
          path: release-files
      - name: Create draft release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faztudo-iptv-build-${{ github.run_number }}
          name: Faz Tudo IPTV - Compilação ${{ github.run_number }}
          draft: true
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release after all files are uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "faztudo-iptv-build-${{ github.run_number }}" --draft=false --repo "${{ github.repository }}"
