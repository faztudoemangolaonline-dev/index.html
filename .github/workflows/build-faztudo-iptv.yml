name: Build Faz Tudo IPTV
on:
  workflow_dispatch:
  push:
    paths:
      - 'FazTudoTecnologia_IPTV/**'
      - '.github/workflows/build-faztudo-iptv.yml'
permissions:
  contents: write
concurrency:
  group: faztudo-iptv-build
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: FazTudoTecnologia_IPTV
        run: flutter create . --platforms=android
      - name: Generate lightweight Faz Tudo Android app icon
        working-directory: FazTudoTecnologia_IPTV
        run: |
          python3 -m pip install --quiet pillow
          python3 tool/generate_brand_assets.py android
      - name: Enable Android TV launcher and remote-control support
        working-directory: FazTudoTecnologia_IPTV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          features = '''    <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
          '''
          if "android.software.leanback" not in source:
              source = source.replace("<application", features + "    <application", 1)
          if 'android:banner="@drawable/tv_banner"' not in source:
              source = source.replace("<application", '<application android:banner="@drawable/tv_banner"', 1)
          match = re.search(r"<activity\b[^>]*>.*?</activity>", source, re.DOTALL)
          if not match:
              raise SystemExit("Activity principal não encontrada no manifesto Android")
          activity = match.group(0)
          if "android.intent.category.LEANBACK_LAUNCHER" not in activity:
              tv_filter = '''
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>'''
              activity = activity.replace("</activity>", tv_filter + "\n                </activity>")
              source = source[:match.start()] + activity + source[match.end():]
          manifest.write_text(source, encoding="utf-8")
          PY
      - name: Ensure Android internet permission
        working-directory: FazTudoTecnologia_IPTV
        run: sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
      - name: Enable Android startup after device boot
        working-directory: FazTudoTecnologia_IPTV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in source:
              source = source.replace("<application", permission + chr(10) + "    <application", 1)
          receiver = """        <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
          """
          if ".BootReceiver" not in source:
              source = source.replace("</application>", receiver + "    </application>")
          manifest.write_text(source)
          main = next(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"))
          package = next(line.split()[1] for line in main.read_text().splitlines() if line.startswith("package "))
          boot = main.parent / "BootReceiver.kt"
          boot.write_text(f'''package {package}

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {{
              override fun onReceive(context: Context, intent: Intent) {{
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {{
                      val launch = Intent(context, MainActivity::class.java)
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(launch)
                  }}
              }}
          }}
          ''')
          PY
      - name: Generate cinematic fire explosion and intro sound
        working-directory: FazTudoTecnologia_IPTV
        run: python3 ../.github/scripts/generate_intro_audio.py
      - name: Resolve packages
        working-directory: FazTudoTecnologia_IPTV
        run: flutter pub get
      - name: Install Android API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not configured" >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found inside $SDK_ROOT" >&2
            exit 1
          fi
          # sdkmanager may close stdin early; prevent harmless yes SIGPIPE from failing the build.
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -e
          "$SDKMANAGER" "platforms;android-36"
      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          roots = [cache / "hosted/pub.dev", Path("FazTudoTecnologia_IPTV/android/.plugin_symlinks")]
          pattern = re.compile(r"(?m)(\\bcompileSdk(?:Version)?\\s*(?:=\\s*)?)(?:flutter\\.compileSdkVersion|\\d+)")
          seen = set()
          for root in roots:
              if not root.exists():
                  continue
              for gradle in root.rglob("build.gradle*"):
                  try:
                      real = gradle.resolve()
                      if real in seen or not real.is_file():
                          continue
                      seen.add(real)
                      source = real.read_text(encoding="utf-8")
                      updated = pattern.sub(r"\\g<1>36", source)
                      if updated != source:
                          real.write_text(updated, encoding="utf-8")
                          print(f"Updated compileSdk 36: {real}")
                  except (OSError, UnicodeError):
                      pass
          print("Android dependency compileSdk compatibility patch completed.")
          PY
      - name: Run IPTV parser tests
        working-directory: FazTudoTecnologia_IPTV
        run: flutter test test/iptv_core_test.dart
      - name: Build APK
        working-directory: FazTudoTecnologia_IPTV
        run: |
          flutter build apk --release --build-name=1.1.0 --build-number=${GITHUB_RUN_NUMBER}
          flutter build apk --release --split-per-abi --build-name=1.1.0 --build-number=${GITHUB_RUN_NUMBER}
      - uses: actions/upload-artifact@v4
        with:
          name: FazTudo-IPTV-Android-APKs
          path: FazTudoTecnologia_IPTV/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows project
        working-directory: FazTudoTecnologia_IPTV
        run: flutter create . --platforms=windows
      - name: Generate Faz Tudo Windows app icon
        working-directory: FazTudoTecnologia_IPTV
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tool/generate_brand_assets.py windows
      - name: Resolve packages
        working-directory: FazTudoTecnologia_IPTV
        run: flutter pub get
      - name: Generate cinematic fire explosion and intro sound
        working-directory: FazTudoTecnologia_IPTV
        shell: pwsh
        run: |
          python ../.github/scripts/generate_intro_audio.py
          if (!(Test-Path "assets/audio/cinematic_intro.wav")) { throw "Intro audio asset was not generated" }
      - name: Run IPTV parser tests
        working-directory: FazTudoTecnologia_IPTV
        run: flutter test test/iptv_core_test.dart
      - name: Build Windows app
        working-directory: FazTudoTecnologia_IPTV
        run: flutter build windows --release --build-name=1.1.0 --build-number=${{ github.run_number }}
      - name: Package Windows files
        shell: pwsh
        run: Compress-Archive -Path "FazTudoTecnologia_IPTV/build/windows/x64/runner/Release/*" -DestinationPath "FazTudoTecnologia_IPTV-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FazTudo-IPTV-Windows
          path: FazTudoTecnologia_IPTV-Windows.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish permanent downloads
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: FazTudo-IPTV-Android-APKs
          path: release-files
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: FazTudo-IPTV-Windows
          path: release-files
      - name: Create draft release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faztudo-iptv-build-${{ github.run_number }}
          name: Faz Tudo IPTV - Compilação ${{ github.run_number }}
          draft: true
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release after all files are uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "faztudo-iptv-build-${{ github.run_number }}" --draft=false --repo "${{ github.repository }}"
