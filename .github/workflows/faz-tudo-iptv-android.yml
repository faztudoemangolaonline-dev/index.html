name: Build Faz Tudo IPTV Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'faz-tudo-iptv/**'
      - '.github/workflows/faz-tudo-iptv-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: faz-tudo-iptv
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Faz-Tudo-Tecnologia-IPTV-APK
          path: faz-tudo-iptv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
